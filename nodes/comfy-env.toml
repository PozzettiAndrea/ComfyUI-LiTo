[cuda]
packages = ["pytorch3d", "gsplat", "nvdiffrast", "flash-attn", "spconv"]

[dependencies]
numpy = ">=2.0"
scipy = ">=1.11.0"
pillow = ">=10.0.0"
einops = "*"
omegaconf = "*"
easydict = ">=1.13"
loguru = ">=0.7.2"
tqdm = "*"
